<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Lab: Who it's for</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  .wbody { display: grid; grid-template-columns: 70px 1fr; }
  .rib { background: var(--bg-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 14px; }
  .rb { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; color: var(--fg-3); transition: none; }
  .rb svg { width: 22px; height: 22px; } .rb.on { background: var(--accent-dim); color: var(--accent-2); box-shadow: inset 3px 0 0 var(--accent); }
  .pane { position: relative; padding: 34px 40px; }
  #who { font-size: 46px; font-weight: 800; letter-spacing: -.03em; height: 62px; }
  #who em { font-style: normal; color: var(--accent-2); }
  #kit { font-size: 20px; color: var(--fg-3); margin-top: 6px; height: 28px; }
  .card { position: absolute; left: 40px; right: 40px; top: 170px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 20px; padding: 26px 28px; }
  .card h4 { font-size: 22px; display: flex; align-items: center; gap: 10px; margin-bottom: 18px; } .card h4 svg { width: 24px; height: 24px; color: var(--accent-2); }
  .stats { display: flex; gap: 34px; flex-wrap: wrap; margin-bottom: 18px; } .stats div { display: flex; flex-direction: column; } .stats b { font-size: 38px; letter-spacing: -.02em; } .stats span { font-size: 15px; color: var(--fg-3); }
  .ok { color: var(--ok); } .bad { color: var(--danger); } .gold { color: var(--gold); }
  .rowx { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 19px; color: var(--fg-2); }
  .rowx b { color: var(--fg); } .rowx .r { margin-left: auto; font-size: 16px; font-weight: 700; }
  .chip { display: inline-flex; padding: 4px 12px; border-radius: 999px; font-size: 15px; font-weight: 700; background: var(--accent-dim); color: var(--accent-2); }
  .chip.ok { background: hsl(142 70% 45% / .16); color: var(--ok); } .chip.bad { background: hsl(0 80% 60% / .14); color: var(--danger); }
  .meter { height: 12px; border-radius: 99px; background: var(--bg-1); overflow: hidden; margin: 10px 0 18px; } .meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #38bdf8); }
  .lanes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; } .lane { background: var(--bg-1); border-radius: 14px; padding: 14px; } .lane small { font-size: 14px; color: var(--fg-3); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; } .lane b { display: block; font-size: 34px; margin-top: 6px; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; } .tile { background: var(--bg-1); border-radius: 12px; padding: 12px 14px; } .tile small { font-size: 13px; font-weight: 800; color: var(--fg-3); letter-spacing: .06em; } .tile b { display: block; font-size: 24px; margin-top: 2px; }
  .post { background: var(--bg-1); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; font-size: 17px; color: var(--fg-2); display: flex; gap: 12px; } .post small { margin-left: auto; color: var(--fg-3); white-space: nowrap; }
  .bars { display: flex; align-items: flex-end; gap: 10px; height: 110px; margin-top: 8px; } .bars i { flex: 1; background: var(--accent); border-radius: 6px 6px 2px 2px; opacity: .85; }
  #tag { left: 0; right: 0; bottom: 40px; text-align: center; font-size: 30px; font-weight: 700; letter-spacing: -.01em; } #tag em { font-style: normal; color: var(--accent-2); }
</style></head>
<body><div id="stage">
  <div class="win abs">
    <div class="bar"><i></i><i></i><i></i><b>Lab <em id="crumb">/ Notes</em></b></div>
    <div class="wbody">
      <div class="rib" id="rib"></div>
      <div class="pane"><div id="who"></div><div id="kit"></div><div id="cards"></div></div>
    </div>
  </div>
  <div id="tag" class="abs">14 kits. <em>Turn on only what you need.</em></div>
</div>
<script src="../shared/base.js"></script>
<script>
const { $, seg, ease, show, icon, cursor, run, cards } = Promo;
cards({ title: "Made for how you work.", subtitle: "Markdown notes, plus the kit for your life.", heading: "Who Lab is for" });
const stat = (v, l, c = "") => `<div><b class="${c}">${v}</b><span>${l}</span></div>`;
const row = (l, r, c = "") => `<div class="rowx">${l}<span class="r ${c}">${r}</span></div>`;
// who, the kit, its icon, and a glimpse of its tab
const KITS = [
  ["students", "Study", "check", "Flashcards and spaced repetition", `<div class="stats">${stat("21", "cards due today")}${stat("4 days", "streak", "ok")}${stat("92%", "remembered")}</div>${row("<b>Biology</b> · cell division", "12 due")}${row("<b>Spanish</b> · verbs", "6 due")}${row("<b>Statistics</b> · cloze from your highlights", "3 due")}`],
  ["researchers", "Research", "cap", "Sources, citations, claims, a thesis", `${row("<b>Claim::</b> sleep improves recall", '<span class="chip ok">supported · 3 sources</span>')}${row("<b>Claim::</b> naps beat coffee", '<span class="chip bad">needs a source</span>')}${row("<b>(Harris et al., 2020)</b> Array programming with NumPy", "cited 4×")}${row("<b>Thesis</b> · 5 chapters, 38 references", "compile")}`],
  ["writers", "Writing", "edit", "Manuscript, word goals, story bible", `<div class="stats">${stat("2,140", "words today")}${stat("41,880", "in the manuscript")}</div><div class="meter"><i style="width:86%"></i></div>${row("<b>Chapter 3</b> · The harbour", "4 scenes")}${row("<b>Continuity</b> · Mara's eyes were green in ch. 1", '<span class="chip bad">check</span>')}`],
  ["job seekers", "Career", "compass", "Applications, résumés, interviews", `<div class="lanes"><div class="lane"><small>Applied</small><b>12</b></div><div class="lane"><small>Screen</small><b>4</b></div><div class="lane"><small>Interview</small><b>2</b></div><div class="lane"><small>Offer</small><b class="ok">1</b></div></div>${row("<b>Acme</b> · Staff Engineer · waiting 11 days", "follow up")}${row("<b>Résumé</b> compiled from 6 experience notes", "Word · PDF")}`],
  ["traders", "Crypto", "coin", "Live prices, a trade journal, theses", `<div class="tiles"><div class="tile"><small>BTC</small><b>$98,490</b></div><div class="tile"><small>ETH</small><b>$3,618</b></div><div class="tile"><small>SOL</small><b>$190.95</b></div><div class="tile"><small>HYPE</small><b>$38.19</b></div></div><div class="stats">${stat("62%", "win rate")}${stat("+$4,210", "realized", "ok")}${stat("1.4R", "average")}</div>${row("<b>Thesis</b> · BTC holds up better than the rest", '<span class="chip ok">+8.1% since</span>')}`],
  ["savers", "Money", "wallet", "Budgets, subscriptions, FIRE", `<div class="stats">${stat("$1,000,000", "FIRE number")}${stat("23.3", "years to go")}${stat("$231,377", "Coast FIRE today", "gold")}</div>${row("<b>50/30/20</b> · wants are $90 over", '<span class="chip bad">over</span>')}${row("<b>Streaming</b> renews in 3 days", "keep or cancel?")}${row("<b>Net worth</b> · crypto priced live", "$34,947")}`],
  ["creators", "Creator", "megaphone", "A content calendar and threads", `<div class="post">The hook: why I moved my notes on-chain <small>1/3 · 64/280</small></div><div class="post">Every notebook is its own canister, and you control it. <small>2/3 · 71/280</small></div><div class="post">Try it and tell me what breaks. <small>3/3 · 38/280</small></div>${row("<b>Last thread</b> · 1,200 impressions", '<span class="chip ok">4.0% engagement</span>')}`],
  ["athletes", "Fitness", "dumbbell", "Workouts, records, runs", `<div class="stats">${stat("Squat 140 kg × 5", "new personal record", "ok")}${stat("18 km", "run this week")}</div><div class="bars">${[3, 4, 2, 5, 4, 6, 5, 7].map((h) => `<i style="height:${h * 14}px"></i>`).join("")}</div>${row("<b>Long run</b> · 12 km from a GPX route", "5:12 /km")}`],
  ["homeowners", "Home", "house", "Upkeep, inventory, warranties", `${row("<b>Change the furnace filter</b> · every 3 months", '<span class="chip bad">due in 3 days</span>')}${row("<b>Test the smoke alarms</b> · every 6 months", "in 2 months")}${row("<b>Fridge</b> · warranty ends Nov 30", '<span class="chip">manual attached</span>')}${row("<b>Inventory</b> · 34 items for insurance", "$18,450")}`],
];
const START = 2.7, EACH = 1.4;
function scene(t) {
  cursor(t, []); // no clicks in this one
  const i = Math.min(KITS.length - 1, Math.max(0, Math.floor((t - START) / EACH)));
  const [who, kit, ic, what, body] = KITS[i];
  const local = t - START - i * EACH;
  const inP = ease(seg(local, 0, .3)), outP = i === KITS.length - 1 ? 0 : ease(seg(local, EACH - .25, EACH));
  $("who").innerHTML = `For <em>${who}</em>`;
  $("kit").textContent = `${kit} · ${what}`;
  $("cards").innerHTML = `<div class="card" style="opacity:${inP * (1 - outP)};transform:translateY(${(1 - inP) * 24 - outP * 16}px)"><h4>${icon(ic)}${kit}</h4>${body}</div>`;
  show($("who"), t < START ? 0 : 1);
  $("crumb").textContent = t < START ? "/ Notes" : `/ ${kit}`;
  $("rib").innerHTML = [["Notes", "file"], ...KITS.map((k) => [k[1], k[2]])].map(([k, icn]) => `<span class="rb${t >= START && k === kit ? " on" : ""}">${icon(icn)}</span>`).join("");
  const tg = ease(seg(t, START + KITS.length * EACH + .1, START + KITS.length * EACH + .5));
  show($("tag"), tg * (1 - ease(seg(t, 17.0, 17.3))), (1 - tg) * 12);
}
run(19, scene);
</script></body></html>
