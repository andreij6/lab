# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v1.6.0/docs/schemas/icp-yaml-schema.json
# Markdown notebooks on ICP: every notebook is its own canister, spawned by the registry and owned by
# the person who created it. Build/deploy with icp-cli (`icp`), never dfx.
canisters:
  # Spawns and upgrades notebook canisters; embeds the notebook wasm (scripts/build.sh).
  - name: registry
    build:
      steps:
        - type: script
          command: ./scripts/build.sh
  - frontend
  # Local only: a stand-in for the ICP LLM canister that answers with your local Ollama
  # (`ollama serve`). On mainnet notebooks call w36hm-eqaaa-aaaal-qr76a-cai directly.
  - name: llm
    build:
      steps:
        - type: script
          command: ./scripts/build_llm_dev.sh
  # Local only: a stand-in for ICP's exchange rate canister with made-up prices, for the Crypto kit.
  # On mainnet notebooks call uf6dk-hyaaa-aaaaq-qaaaq-cai directly.
  - name: xrc
    build:
      steps:
        - type: script
          command: ./scripts/build_xrc_dev.sh

networks:
  - name: local
    mode: managed
    gateway:
      port: 0  # OS-assigned: read the URL from `icp network status --json`
    # NNS = ICP ledger + CMC locally, so notebook top-ups convert ICP to cycles end to end; implies II
    nns: true

environments:
  - name: local
    network: local
    canisters: [registry, frontend, llm, xrc]
  - name: ic
    network: ic
    canisters: [registry, frontend]
