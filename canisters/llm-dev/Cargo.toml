[package]
name = "llm_dev"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Local stand-in for the ICP LLM canister: same v1_chat interface, answered by a local Ollama."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid.workspace = true
ic-cdk.workspace = true
ic-cdk-management-canister.workspace = true
serde.workspace = true
serde_json = "1"
ic-llm = "2.0"
