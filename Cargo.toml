[workspace]
resolver = "2"
members = ["canisters/notebook", "canisters/registry", "canisters/llm-dev"]

[workspace.dependencies]
candid = "0.10"
ic-cdk = "0.20.3"
ic-cdk-management-canister = "0.2"
ic-cdk-timers = "1.0"
ic-stable-structures = "0.7"
serde = { version = "1", features = ["derive"] }
ic-ledger-types = "0.16"
icrc-ledger-types = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = false
